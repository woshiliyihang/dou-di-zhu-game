plugins {
    id 'com.android.application'
}

// Every build gets a monotonically increasing local number unless the push script
// supplies its own. It appears in versionCode, versionName and the APK filename.
def defaultBuildNo = (System.currentTimeMillis() / 1000L - 1577836800L) as long
def buildNoProperty = project.findProperty('buildNo')
def buildNo
if (buildNoProperty != null) {
    buildNo = buildNoProperty.toString().toLong()
} else {
    def buildNoFile = rootProject.file('.buildnum')
    def previousBuildNo = buildNoFile.exists()
            ? buildNoFile.getText('UTF-8').trim().toLong()
            : 0L
    buildNo = Math.max(defaultBuildNo, previousBuildNo + 1L)
    buildNoFile.setText(buildNo.toString(), 'UTF-8')
}
def buildVersionCode = (10000L + buildNo).intValue()

android {
    namespace 'com.example.vtrans'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.vtrans"
        minSdk 28
        targetSdk 35
        versionCode buildVersionCode
        versionName "1.0.0-b" + buildNo

        // 只做骁龙 888（arm64）这一档设备：省掉 32 位与 x86 的 so，体积减半
        ndk {
            abiFilters "arm64-v8a"
        }
        // ASR 与 OPUS-MT 由单一 native/JNI 路径加载，维持单 dex。
        multiDexEnabled false
    }

    signingConfigs {
        debug {
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            // release 用 debug 签名仅为了方便 adb install 验证；
            // 正式分发前请替换成自己的签名（见 README「发布签名」）
            signingConfig signingConfigs.debug
        }
    }

    // 编译目标锁 17。刻意不用 java.toolchain 锁 JDK 版本：
    // Android Studio 自带的 JDK 可能是 17 也可能是 21，写死 17 会在没有配置
    // toolchain resolver 的机器上直接构建失败。用 -source/-target 17 就够了，
    // 本机/CI 只要有 JDK 17 或 21 都能编。
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 模型随 APK 打包，且必须「不压缩」存储：
    // 模型 asset 保持不压缩，避免读取时额外解压占用内存，并可用 openFd() 获取精确长度。
    androidResources {
        // 'model' / 'txt' 也一起存原样：不压缩才能用 openFd 问长度，解包进度才准
        noCompress 'bin', 'onnx', 'model', 'txt', 'json', 'spm'
    }

    packagingOptions {
        // assets/models/ 下的模型也要进包（默认的 excludes 不会动 assets）
        excludes += ['META-INF/*']
        jniLibs {
            // 只保留 arm64，且不压缩 so（压缩会拖慢加载、增加内存）
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi-v7a/**']
            useLegacyPackaging false
        }
    }

    // 只有 Java + 资源，没有 Kotlin、没有 AIDL、没有 RenderScript
    buildFeatures {
        buildConfig true
        viewBinding false
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'MissingTranslation', 'ExtraTranslation'
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        outputFileName = "vtrans-${variant.name}-b${buildNo}.apk"
    }
}

dependencies {
    // sherpa-onnx 的 Java API（纯 Kotlin 编译产物，只用它做 VAD + ASR）
    implementation files('libs/sherpa-onnx-classes.jar')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.15.0'
}
